<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle circles decoration -->
  <circle cx="1100" cy="80" r="200" fill="white" fill-opacity="0.04"/>
  <circle cx="100" cy="550" r="180" fill="white" fill-opacity="0.04"/>
  <circle cx="600" cy="315" r="400" fill="white" fill-opacity="0.02"/>

  <!-- Card glass -->
  <rect x="80" y="60" width="1040" height="510" rx="32" fill="url(#card)" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Heart icon -->
  <text x="600" y="220" font-size="90" text-anchor="middle" fill="white" font-family="sans-serif">❤️</text>

  <!-- Main title -->
  <text x="600" y="310" font-size="88" font-weight="900" text-anchor="middle" fill="white" font-family="Arial, sans-serif" letter-spacing="-2">EcuFund</text>

  <!-- Divider line -->
  <rect x="500" y="330" width="200" height="4" rx="2" fill="white" fill-opacity="0.4"/>

  <!-- Subtitle -->
  <text x="600" y="395" font-size="32" font-weight="400" text-anchor="middle" fill="white" fill-opacity="0.85" font-family="Arial, sans-serif">Apoya causas que importan en Ecuador</text>

  <!-- Call to action pill -->
  <rect x="450" y="435" width="300" height="54" rx="27" fill="white" fill-opacity="0.18" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="470" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="Arial, sans-serif">🇪🇨 unidosec.web.app</text>
</svg>
